name: build

# Verifies the launcher still compiles and the produced exe actually runs.
# Runs on every push so a broken build is caught before anyone tags a release.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build
        # Explicit Bypass because the runner's execution policy is not ours to
        # assume, and the in-box csc.exe needs no other setup.
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File ./build.ps1

      - name: Smoke test
        # Windows PowerShell 5.1, matching the Build step, so this runs on the
        # same interpreter it was tested on. Not pwsh: ReflectionOnlyLoadFrom
        # does not exist on .NET Core.
        shell: powershell
        run: |
          $exe = 'dist\IrokConfigurator.exe'
          if (-not (Test-Path $exe)) { throw 'build produced no exe' }

          # --help must exit 0 on a freshly built binary
          $p = Start-Process -FilePath $exe -ArgumentList '--help' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "--help exited $($p.ExitCode)" }

          # The embedded icon resource must have made it into the assembly,
          # otherwise a fresh install has no icon to fall back on.
          # LoadFrom rather than ReflectionOnlyLoadFrom: the latter is
          # .NET Framework only and throws on PowerShell 7.
          $asm = [System.Reflection.Assembly]::LoadFrom((Resolve-Path $exe))
          $names = $asm.GetManifestResourceNames()
          if ($names -notcontains 'irok.ico') { throw "irok.ico not embedded, found: $($names -join ', ')" }
          $stream = $asm.GetManifestResourceStream('irok.ico')
          if ($stream.Length -lt 100) { throw "embedded icon is only $($stream.Length) bytes" }
          $stream.Close()

          Write-Host "smoke test passed"

      - name: Upload exe
        uses: actions/upload-artifact@v7
        with:
          name: IrokConfigurator
          path: dist/IrokConfigurator.exe
          if-no-files-found: error
