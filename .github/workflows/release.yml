name: release

# Builds on a version tag and attaches the binary to a GitHub Release.
# Split from build.yml on purpose: publishing needs write access, and this way
# ordinary pushes to main only ever get read.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File ./build.ps1

      - name: Checksum
        shell: pwsh
        run: |
          $exe = 'dist\IrokConfigurator.exe'
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          "SHA256  $hash  IrokConfigurator.exe" |
            Out-File -FilePath 'IrokConfigurator.sha256.txt' -Encoding ascii
          Write-Host "sha256: $hash"

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/IrokConfigurator.exe
            IrokConfigurator.sha256.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## Install

            Download `IrokConfigurator.exe` and run it. No installer, no .NET,
            no admin rights.

            ### Windows will warn you

            This binary is **not code-signed**, so SmartScreen shows
            *Windows protected your PC* on first run. Choose
            **More info → Run anyway**.

            That prompt is a property of being unsigned, not evidence of a
            problem. The `.sha256.txt` asset lets you confirm the download is
            intact, though note it is published by the same build that produced
            the exe, so it only tells you something if you already trust this
            repository.

            ### First run

            Dismiss the browser welcome screen, then pick your keyboard in the
            device list. The browser remembers that, so it is a one-time step.

            ### Uninstall

            *Settings → Apps → Installed apps → Irok Configurator*, or run
            `IrokConfigurator.exe --uninstall`.

