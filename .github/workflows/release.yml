name: release

# Builds on a version tag and attaches the binary to a GitHub Release.
# Split from build.yml on purpose: publishing needs write access, and this way
# ordinary pushes to main only ever get read.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File ./build.ps1

      - name: Checksum and package
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'
          $exe = 'dist\IrokConfigurator.exe'
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash

          "SHA256  $hash  IrokConfigurator.exe" |
            Out-File -FilePath "IrokConfigurator-$version.sha256.txt" -Encoding ascii
          Add-Content -Path "IrokConfigurator-$version.sha256.txt" -Value "SHA256  $hash  IrokConfigurator-$version.zip"

          Compress-Archive -Path $exe -DestinationPath "IrokConfigurator-$version.zip"
          Write-Host "published sha256: $hash"

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            IrokConfigurator-${{ github.ref_name }}.zip
            IrokConfigurator-${{ github.ref_name }}.sha256.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## Install

            Download `IrokConfigurator-${{ github.ref_name }}.zip`, extract
            `IrokConfigurator.exe`, run it. No installer, no .NET, no admin.

            ### Windows will warn you

            This binary is **not code-signed**, so SmartScreen shows
            *Windows protected your PC* on first run. Choose
            **More info → Run anyway**.

            That prompt is a property of being unsigned, not evidence of a
            problem. You can check the file before running it: the SHA-256 in
            the `.sha256.txt` asset is produced by this repository's own CI from
            the source in the tag, so if it matches, the exe came from the code
            you can read.

            ### First run

            Dismiss the browser welcome screen, then pick your keyboard in the
            device list. The browser remembers that, so it is a one-time step.

            ### Uninstall

            *Settings → Apps → Installed apps → Irok Configurator*, or run
            `IrokConfigurator.exe --uninstall`.

